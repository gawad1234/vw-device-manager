appId: com.gawad.vwdevicemanager
productName: Device Manager
directories:
  buildResources: build
# Ad-hoc sign the macOS app after packing (we ship unsigned; without a valid
# seal an Apple-Silicon build launches as "damaged"). See build/after-pack.cjs.
afterPack: build/after-pack.cjs
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!data'
  - '!dist'
  - '!vectorworks-scripts'
  - '!*.command'
  - '!*.bat'
  # Dropbox sync conflict artifacts (e.g. "node_modules 2") — never bundle them
  - '!node_modules 2'
  - '!**/*conflicted copy*'
asarUnpack:
  - resources/**
win:
  executableName: vw-device-manager
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # Keep artifact FILE names space-free (GitHub rewrites spaces to dots on
  # upload, which would break the latest-mac.yml auto-update URL). The app's
  # display name is still "Device Manager" via productName.
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  target:
    - dmg
    - zip
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: gawad1234
  repo: vw-device-manager
